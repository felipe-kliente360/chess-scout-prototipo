<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Exporter — miguelrov</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0d0d0d;
      font-family: 'Courier New', monospace;
      color: #e8e0cc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .header { text-align: center; margin-bottom: 40px; }
    .header .icon { font-size: 48px; margin-bottom: 8px; }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #f0c040;
    }
    .header p { color: #888; margin-top: 8px; font-size: 13px; letter-spacing: 2px; }
    .dashboard {
      width: 100%;
      max-width: 1280px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }
    @media (max-width: 1100px) {
      .dashboard { grid-template-columns: 1fr; }
    }
    .panel {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel.right { min-height: 600px; }
    .terminal-label {
      background: #111;
      border-bottom: 1px solid #222;
      padding: 12px 16px;
      font-size: 11px;
      color: #555;
      letter-spacing: 1px;
    }
    #log {
      flex: 1;
      min-height: 540px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      padding: 16px;
      font-size: 13px;
      line-height: 1.7;
    }
    .log-idle { color: #444; }
    .log-ok { color: #6fcf6f; }
    .log-warn { color: #e0a030; }
    .log-err { color: #e05555; }
    .log-normal { color: #b0a888; }
    .cursor { color: #f0c040; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0} }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
    }
    .stat {
      text-align: center;
      padding: 14px 8px;
      border-right: 1px solid #222;
    }
    .stat:last-child { border-right: none; }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 10px; color: #555; letter-spacing: 1px; margin-top: 4px; }
    .actions { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .config {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid #222;
      background: #0f0f0f;
    }
    .config label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 10px;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .config input, .config select {
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      color: #f0c040;
      padding: 8px 10px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      border-radius: 3px;
      outline: none;
    }
    .config input:focus, .config select:focus { border-color: #f0c040; }
    .time-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 4px 0; }
    .time-filters .tf {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: #b0a888; text-transform: none;
      letter-spacing: 0; padding: 0; cursor: pointer; user-select: none;
    }
    .time-filters .tf input { accent-color: #f0c040; cursor: pointer; }
    #estimate {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      font-size: 12px;
      color: #888;
      background: #0f0f0f;
      line-height: 1.5;
    }
    button {
      padding: 11px 8px;
      border: none;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    #btn-fetch {
      background: #f0c040;
      color: #0d0d0d;
    }
    #btn-fetch:disabled {
      background: #1a1a1a;
      color: #444;
      cursor: not-allowed;
    }
    #btn-analyze {
      display: none;
      background: transparent;
      color: #4fc3f7;
      border: 1px solid #4fc3f7 !important;
    }
    #btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }
    #btn-reset { background: transparent; color: #888; border: 1px solid #444 !important; }
    #btn-download-diag { background: transparent; color: #888; border: 1px solid #444 !important; font-size: 10px; }
    .preview { width: 100%; max-width: 1280px; margin-top: 24px; }
    .preview-label { font-size: 11px; color: #555; letter-spacing: 2px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      padding: 8px 12px;
      text-align: left;
      color: #555;
      font-weight: 400;
      letter-spacing: 1px;
      font-size: 11px;
      border-bottom: 1px solid #2a2a2a;
    }
    td { padding: 10px 12px; border-bottom: 1px solid #1a1a1a; }
    .win { color: #6fcf6f; }
    .loss { color: #e05555; }
    .draw { color: #888; }
  </style>
</head>
<body>

<div class="header">
  <div class="icon">♟</div>
  <h1>Chess Exporter</h1>
  <p id="subtitle">configure e busque partidas</p>
  <p id="mode-badge" style="margin-top:8px"></p>
</div>

<div class="dashboard">
  <div class="panel left">
    <div class="terminal-label">CONFIGURAÇÃO</div>
    <div class="config">
      <label>
        Username Chess.com
        <input type="text" id="input-username" value="miguelrov" />
      </label>
      <label>
        Qtd. partidas <span id="target-hint" style="color:#888;font-size:0.85em">(por formato)</span>
        <input type="number" id="input-target" value="50" min="1" max="500" />
      </label>
      <label>
        Modo de cota
        <div class="quota-mode" style="display:flex;gap:14px;font-size:0.9em;padding:4px 0">
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
            <input type="radio" name="quota-mode" value="per-style" checked> por estilo
          </label>
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
            <input type="radio" name="quota-mode" value="total"> total (recência)
          </label>
        </div>
      </label>
      <label>
        Depth Stockfish <span id="depth-hint" style="color:#888;font-size:0.85em">(15 = padrão recomendado)</span>
        <input type="number" id="input-depth" value="15" min="1" max="22" />
      </label>
      <label>
        Engine
        <select id="input-engine">
          <option value="api">API remota (stockfish.online)</option>
          <option value="local" selected>Stockfish local (WASM)</option>
        </select>
      </label>
      <label>
        Formatos
        <div class="time-filters">
          <label class="tf"><input type="checkbox" class="tf-cb" value="bullet" checked> bullet</label>
          <label class="tf"><input type="checkbox" class="tf-cb" value="blitz" checked> blitz</label>
          <label class="tf"><input type="checkbox" class="tf-cb" value="rapid" checked> rapid</label>
          <label class="tf"><input type="checkbox" class="tf-cb" value="daily" checked> daily</label>
        </div>
        <div style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <button id="btn-trend" type="button" onclick="fetchProfileTrend()" style="font-size:0.8em;padding:3px 8px">🔍 Detectar tendência (60d)</button>
          <span id="trend-hint" style="color:#888;font-size:0.85em">— clique para ver distribuição recente</span>
        </div>
      </label>
    </div>

    <div id="estimate" class="log-idle">⏱ tempo estimado: —</div>

    <div id="db-state" class="log-idle" style="margin-top:6px;font-size:0.85em;display:none">
      <span id="db-state-text"></span>
      <button id="btn-analyze-pending" type="button" onclick="analyzePending()" style="display:none;font-size:0.8em;padding:3px 8px;margin-left:6px">⚙ Analisar pendentes (sem refetch)</button>
    </div>

    <div class="stats" id="stats" style="display:none">
      <div class="stat">
        <div class="stat-value win" id="stat-wins">0</div>
        <div class="stat-label">VITÓRIAS</div>
      </div>
      <div class="stat">
        <div class="stat-value loss" id="stat-losses">0</div>
        <div class="stat-label">DERROTAS</div>
      </div>
      <div class="stat">
        <div class="stat-value draw" id="stat-draws">0</div>
        <div class="stat-label">EMPATES</div>
      </div>
    </div>

    <div class="actions">
      <button id="btn-fetch" onclick="fetchGames()" style="grid-column: span 2;">Buscar Partidas</button>
      <button id="btn-analyze" onclick="analyzeGames()" style="grid-column: span 2;">⚙ Analisar Stockfish</button>
      <button id="btn-queue-backend" onclick="queueOnBackend()" style="grid-column: span 2;">⚡ Enfileirar no backend (Stockfish nativo)</button>
      <button id="btn-download-diag" onclick="downloadDiagnostics()">↓ Diag API</button>
      <button id="btn-reset" onclick="resetSession()">🔄 Nova Análise</button>
    </div>
  </div>

  <div class="panel right">
    <div class="terminal-label">TERMINAL OUTPUT</div>
    <div id="log"><span class="log-idle">Aguardando início...</span></div>
  </div>
</div>

<div class="preview" id="preview" style="display:none">
  <div class="preview-label">PRÉVIA — 5 PARTIDAS MAIS RECENTES</div>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>DATA</th><th>COR</th><th>ADVERSÁRIO</th>
          <th>RATING</th><th>RESULTADO</th><th>TEMPO</th>
        </tr>
      </thead>
      <tbody id="preview-body"></tbody>
    </table>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="tactical-themes.js"></script>
<script>
  const STOCKFISH_API = "https://stockfish.online/api/s/v2.php";
  const STOCKFISH_WASM_URLS = [
    "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js",
    "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js",
    "https://unpkg.com/stockfish.js@10.0.2/stockfish.js",
  ];
  let USERNAME = "miguelrov";
  let TARGET = 50;
  let STOCKFISH_DEPTH = 18;
  let ENGINE = "local";
  let TIME_CLASSES = new Set(["bullet", "blitz", "rapid", "daily"]);
  // QUOTA_MODE: "per-style" = TARGET por formato (atual); "total" = TARGET partidas
  // mais recentes do conjunto de formatos selecionados (qualquer mix).
  let QUOTA_MODE = "per-style";
  let allGames = [];
  let allAnalysis = [];

  // Servidor local (scripts/serve.py) é detectado quando a página é carregada
  // via http(s). Abrir o index.html como file:// não funciona — o app exige servidor.
  const SERVER_MODE = (location.protocol === "http:" || location.protocol === "https:");
  async function api(path, body) {
    const opts = body !== undefined
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
      : { method: "GET" };
    const res = await fetch(path, opts);
    if (!res.ok) throw new Error(`API ${path} → HTTP ${res.status}`);
    return res.json();
  }

  // Renderiza stats + tabela de prévia a partir de allGames. Chamado tanto
  // pelo fetchGames quanto pelo analyzePending (para reusar o painel sem
  // duplicar código de renderização).
  function renderPreview() {
    if (!allGames.length) return;
    const wins = allGames.filter(g => g.result === "Win").length;
    const losses = allGames.filter(g => g.result === "Loss").length;
    const draws = allGames.filter(g => g.result === "Draw").length;
    document.getElementById("stat-wins").textContent = wins;
    document.getElementById("stat-losses").textContent = losses;
    document.getElementById("stat-draws").textContent = draws;
    document.getElementById("stats").style.display = "flex";

    const tbody = document.getElementById("preview-body");
    tbody.innerHTML = "";
    allGames.slice(-5).reverse().forEach(g => {
      const tr = document.createElement("tr");
      const resultClass = g.result === "Win" ? "win" : g.result === "Loss" ? "loss" : "draw";
      const resultText = g.result === "Win" ? "✓ Vitória" : g.result === "Loss" ? "✗ Derrota" : "= Empate";
      const colorIcon = g.color === "White" ? "⬜ Brancas" : "⬛ Pretas";
      tr.innerHTML = `
        <td style="color:#888">${g.date}</td>
        <td>${colorIcon}</td>
        <td>${g.opponent}</td>
        <td style="color:#888">${g.opponent_rating || "—"}</td>
        <td class="${resultClass}">${resultText}</td>
        <td style="color:#888">${g.time_class}</td>
      `;
      tbody.appendChild(tr);
    });
    document.getElementById("preview").style.display = "block";
    document.getElementById("btn-analyze").style.display = "block";
  }

  // Estado persistente do DB para o user atual: mostra quantas partidas
  // já foram coletadas, quantas precisam de análise no depth alvo, e
  // habilita botão "Analisar pendentes" sem refetch quando aplicável.
  async function refreshDbState() {
    const u = (document.getElementById("input-username").value || "").trim();
    const d = parseInt(document.getElementById("input-depth").value, 10) || 15;
    const wrap = document.getElementById("db-state");
    const txt = document.getElementById("db-state-text");
    const btn = document.getElementById("btn-analyze-pending");
    if (!SERVER_MODE || !u) { wrap.style.display = "none"; return; }
    try {
      const summary = await api(`/api/summary?username=${encodeURIComponent(u)}`);
      const total = summary.total_games || 0;
      const positions = summary.total_positions || 0;
      if (total === 0) {
        wrap.style.display = "block";
        txt.textContent = `📂 ${u}: nenhuma partida no DB ainda — clique "Buscar Partidas" para coletar.`;
        btn.style.display = "none";
        return;
      }
      // Quais partidas precisam de análise no depth alvo?
      const needed = await api(`/api/analyses/needed?username=${encodeURIComponent(u)}&depth=${d}`);
      const nNeeded = (needed || []).length;
      wrap.style.display = "block";
      if (nNeeded === 0) {
        txt.textContent = `📂 ${u}: ${total} partidas no DB · ${positions} lances analisados em depth ≥ ${d} ✓`;
        btn.style.display = "none";
      } else {
        txt.textContent = `📂 ${u}: ${total} partidas no DB · ${nNeeded} ainda precisam de análise em depth ${d}`;
        btn.style.display = "inline-block";
        btn.dataset.nPending = String(nNeeded);
      }
    } catch (_) { wrap.style.display = "none"; }
  }

  // Enfileira partidas pendentes no backend nativo (workers Python +
  // Stockfish binário). Browser fecha o ciclo: posta game_ids na fila e
  // entra em modo polling de progresso até zerar pending+running.
  // Quem roda o worker: `python scripts/analyze_worker.py --workers 4 --depth 18`.
  async function queueOnBackend() {
    if (!SERVER_MODE) { alert("Servidor desligado. Rode bash scripts/start.sh."); return; }
    const u = (document.getElementById("input-username").value || "").trim();
    if (!u) { alert("Username vazio."); return; }
    try { readConfig(); } catch (e) { alert(e.message); return; }
    log("─".repeat(40), "log-idle");
    log(`▶ Enfileirando partidas pendentes no backend nativo (${USERNAME}, depth ${STOCKFISH_DEPTH})...`);
    try {
      const needed = await api(`/api/analyses/needed?username=${encodeURIComponent(USERNAME)}&depth=${STOCKFISH_DEPTH}`);
      const ids = (needed || []).map(g => g.game_id);
      if (!ids.length) {
        log("  ✓ Nada pendente — todas as partidas já têm análise no depth alvo.", "log-ok");
        return;
      }
      const r = await api("/api/analyze/queue", {
        username: USERNAME, game_ids: ids, target_depth: STOCKFISH_DEPTH,
      });
      log(`  ✓ ${r.enqueued} enfileiradas, ${r.skipped_existing} já em fila/done, ${r.reset} retomadas.`);
      log("  ⓘ Para processar: rode em outro terminal:", "log-idle");
      log(`     python scripts/analyze_worker.py --workers 4 --depth ${STOCKFISH_DEPTH}`, "log-idle");
      // Polling: a cada 3s mostra progresso até pending+running == 0.
      const poll = async () => {
        try {
          const p = await api(`/api/analyze/progress?username=${encodeURIComponent(USERNAME)}`);
          const pending = (p.pending || 0) + (p.running || 0);
          log(`  📊 progresso: pending=${p.pending} running=${p.running} done=${p.done} error=${p.error}`);
          if (pending > 0) {
            setTimeout(poll, 3000);
          } else {
            log(`  ✓ Backend concluiu: ${p.done} partidas analisadas, ${p.error} com erro.`, "log-ok");
            refreshDbState();
          }
        } catch (e) {
          log(`  ⚠ falha no polling (${e.message})`, "log-warn");
        }
      };
      setTimeout(poll, 2000);
    } catch (e) {
      log(`❌ ${e.message}`, "log-err");
    }
  }

  // Análise de pendentes sem refetch: usa as partidas já em history.db,
  // monta allGames a partir delas e dispara o pipeline normal de analyzeGames.
  async function analyzePending() {
    const u = (document.getElementById("input-username").value || "").trim();
    if (!SERVER_MODE) { alert("Servidor desligado. Rode bash scripts/start.sh."); return; }
    if (!u) { alert("Username vazio."); return; }
    try { readConfig(); } catch (e) { alert(e.message); return; }
    log("─".repeat(40), "log-idle");
    log(`▶ Analisando pendentes para ${USERNAME} em depth ${STOCKFISH_DEPTH} (sem refetch)`);
    try {
      const games = await api(`/api/games?username=${encodeURIComponent(USERNAME)}`);
      if (!games?.length) { log("⚠ Nenhuma partida no DB para esse user.", "log-warn"); return; }
      // Filtra pelos formatos selecionados.
      const filtered = games.filter(g => TIME_CLASSES.has(g.time_class));
      if (!filtered.length) { log(`⚠ Nenhuma partida nos formatos selecionados (${[...TIME_CLASSES].join("+")}).`, "log-warn"); return; }
      allGames = filtered;
      log(`  ✓ ${allGames.length} partidas carregadas do DB (${games.length - allGames.length} fora dos formatos selecionados).`);
      const ecoHits = applyOpeningClassification(allGames);
      log(`📚 Aberturas reclassificadas via ECO: ${ecoHits}/${allGames.length}.`);
      await loadPositionCache();
      await loadCalibration();
      // Mostra prévia e dispara analyzeGames (que já reusa game_analyses no DB).
      renderPreview();
      await analyzeGames();
    } catch (e) {
      log(`❌ Erro ao analisar pendentes: ${e.message}`, "log-err");
    } finally {
      refreshDbState();
    }
  }

  // Pré-get de tendência: pega últimos 60 dias do perfil chess.com,
  // pondera por recência (exp(-days/30) — meia-vida 30d) para enxergar
  // tendência atual do estilo de jogo. Mostra a distribuição na UI
  // como dica para o usuário escolher os formatos certos antes da análise.
  async function fetchProfileTrend() {
    const u = (document.getElementById("input-username").value || "").trim();
    const hint = document.getElementById("trend-hint");
    const btn = document.getElementById("btn-trend");
    if (!u) { hint.textContent = "— informe o username primeiro"; return; }
    btn.disabled = true; btn.textContent = "buscando...";
    hint.textContent = "buscando últimos 60 dias...";
    try {
      const archRes = await fetch(`https://api.chess.com/pub/player/${u}/games/archives`);
      if (!archRes.ok) throw new Error(`status ${archRes.status}`);
      const { archives } = await archRes.json();
      if (!archives?.length) throw new Error("sem arquivos");
      // Pega os 3 arquivos mais recentes (cobre ~90 dias com folga; filtra <60d).
      const tail = archives.slice(-3);
      const cutoffMs = Date.now() - 60 * 86400_000;
      const halfMs = Date.now() - 30 * 86400_000;
      const tau_days = 30;
      const weighted = {};   // {time_class: peso acumulado}
      const recent = {};     // últimos 30d (raw count)
      const older = {};      // 30-60d (raw count)
      let totalGames = 0, totalRecent = 0, totalOlder = 0;
      for (const url of tail) {
        const r = await fetch(url);
        if (!r.ok) continue;
        const { games } = await r.json();
        if (!games?.length) continue;
        for (const g of games) {
          const endMs = (g.end_time || 0) * 1000;
          if (!endMs || endMs < cutoffMs) continue;
          const tc = g.time_class || "rapid";
          const daysAgo = (Date.now() - endMs) / 86400_000;
          const w = Math.exp(-daysAgo / tau_days);
          weighted[tc] = (weighted[tc] || 0) + w;
          if (endMs >= halfMs) {
            recent[tc] = (recent[tc] || 0) + 1;
            totalRecent++;
          } else {
            older[tc] = (older[tc] || 0) + 1;
            totalOlder++;
          }
          totalGames++;
        }
      }
      if (!totalGames) {
        hint.textContent = "— sem partidas nos últimos 60 dias";
        return;
      }
      const totalWeight = Object.values(weighted).reduce((a, b) => a + b, 0) || 1;
      const distribuicao = Object.entries(weighted)
        .map(([tc, w]) => ({ tc, pct: Math.round(100 * w / totalWeight) }))
        .sort((a, b) => b.pct - a.pct)
        .filter(e => e.pct > 0);
      // Detecta tendência: top class subiu/caiu entre os 30d antigos e os 30d novos?
      const top = distribuicao[0]?.tc;
      let trendNote = "";
      if (top && totalRecent > 0 && totalOlder > 0) {
        const recentPct = Math.round(100 * (recent[top] || 0) / totalRecent);
        const olderPct = Math.round(100 * (older[top] || 0) / totalOlder);
        const delta = recentPct - olderPct;
        if (Math.abs(delta) >= 10) {
          trendNote = ` · ${top} ${delta > 0 ? "↑" : "↓"} ${Math.abs(delta)}pp (${olderPct}%→${recentPct}%)`;
        }
      }
      const dist = distribuicao.map(e => `${e.tc} ${e.pct}%`).join(" · ");
      hint.textContent = `60d ponderado: ${dist} (${totalGames} partidas)${trendNote}`;
      hint.style.color = "#5a8";
      // Auto-marca os formatos que aparecem (apenas se usuário não desmarcou).
      // Não altera escolha existente — só sugere via cor; deixa decisão ao user.
    } catch (e) {
      hint.textContent = `— falha (${e.message})`;
      hint.style.color = "#c66";
    } finally {
      btn.disabled = false; btn.textContent = "🔍 Detectar tendência (60d)";
    }
  }

  function readConfig() {
    const u = document.getElementById("input-username").value.trim();
    const t = parseInt(document.getElementById("input-target").value, 10);
    const d = parseInt(document.getElementById("input-depth").value, 10);
    const eng = document.getElementById("input-engine").value;
    const selectedTC = Array.from(document.querySelectorAll(".tf-cb:checked")).map(cb => cb.value);
    const quotaMode = document.querySelector('input[name="quota-mode"]:checked')?.value || "per-style";
    if (!u) throw new Error("Username vazio.");
    if (!t || t < 1) throw new Error("Quantidade inválida.");
    if (!d || d < 1 || d > 22) throw new Error("Depth deve estar entre 1 e 22.");
    if (!selectedTC.length) throw new Error("Selecione pelo menos um formato (bullet, blitz, rapid ou daily).");
    // Cap total: depende do modo. per-style: TARGET × N formatos. total: TARGET.
    const totalGames = quotaMode === "total" ? t : t * selectedTC.length;
    if (totalGames > 400) {
      const detail = quotaMode === "total" ? `${t} no total` : `${t} × ${selectedTC.length} formatos = ${totalGames}`;
      throw new Error(`${detail} partidas excede o limite de 400. Reduza qtd ou formatos.`);
    }
    USERNAME = u;
    TARGET = t;
    STOCKFISH_DEPTH = d;
    ENGINE = eng === "local" ? "local" : "api";
    TIME_CLASSES = new Set(selectedTC);
    QUOTA_MODE = quotaMode;
    const subtitleQuota = quotaMode === "total" ? `${t} total` : `${t}/formato`;
    document.getElementById("subtitle").textContent = `${USERNAME} · ${subtitleQuota} · depth ${STOCKFISH_DEPTH} · ${selectedTC.join("+")} · ${ENGINE}`;
    // Atualiza dica do campo qtd. partidas conforme o modo
    const targetHint = document.getElementById("target-hint");
    if (targetHint) targetHint.textContent = quotaMode === "total" ? "(total)" : "(por formato)";
  }

  // Calibração observada (preenchida sob demanda via /api/execution-logs/calibration).
  // Estrutura: {"local|15": {n, sec_per_pos_median, ...}, "api|18": {...}}.
  let CALIBRATION = null;
  let CALIBRATION_LOADED_AT = 0;

  async function loadCalibration() {
    // TTL 60s — recarrega se ficou velho. Falha silenciosa se servidor offline.
    if (CALIBRATION && (Date.now() - CALIBRATION_LOADED_AT) < 60_000) return CALIBRATION;
    if (!SERVER_MODE) return null;
    try {
      const data = await api("/api/execution-logs/calibration");
      CALIBRATION = data || {};
      CALIBRATION_LOADED_AT = Date.now();
    } catch (_) {
      CALIBRATION = null;
    }
    return CALIBRATION;
  }

  // Empírico em Mac M-series com stockfish.js single-thread:
  // d10≈0.10s/pos · d12≈0.20s · d15≈0.80s · d18≈3.0s · d20≈8.0s · d22≈25s
  // Modelo: overhead fixo (handshake isready + msg passing) + tempo do engine ~ branching^d
  // Se houver calibração observada (≥3 execuções no DB), prefere o sec/pos mediano real.
  function estimateSecondsPerPosition(depth, engine) {
    const cal = (CALIBRATION && CALIBRATION.by_engine_depth) || null;
    if (cal) {
      const exact = cal[`${engine}|${depth}`];
      if (exact && exact.n >= 3 && exact.sec_per_pos_median > 0) {
        return exact.sec_per_pos_median;
      }
    }
    if (engine === "local") {
      const overhead = 0.18;  // isready/readyok + postMessage round-trip
      const engineSec = 0.05 * Math.pow(1.7, Math.max(0, depth - 10));
      return overhead + engineSec;
    }
    return 0.25 + 0.06 * Math.pow(1.18, Math.max(0, depth - 8));
  }

  function avgPliesFromGames() {
    if (!allGames.length) return 80;  // estimativa default (era 60, calibrado pra mais)
    let sum = 0, n = 0;
    for (const g of allGames) {
      const p = countPlies(g.pgn);
      if (p > 0) { sum += p; n++; }
    }
    return n ? Math.round(sum / n) : 80;
  }

  function expectedTotalPositions() {
    if (allGames.length) {
      return allGames.reduce((acc, g) => acc + countPlies(g.pgn), 0);
    }
    const nClasses = TIME_CLASSES.size || 1;
    // per-style: TARGET por formato × N formatos × ~80 plies. total: TARGET × ~80 plies.
    const expectedGames = QUOTA_MODE === "total" ? TARGET : TARGET * nClasses;
    return expectedGames * 80;
  }

  function expectedCacheHitRate() {
    if (!positionCache || !allGames.length) return 0;
    const sample = Math.min(8, allGames.length);
    let positions = 0, hits = 0;
    for (let i = 0; i < sample; i++) {
      const g = allGames[i];
      const moves = extractMovesFromPGN(g.pgn);
      if (!moves) continue;
      for (const mv of moves) {
        positions++;
        if (getCachedAnalysis(mv.fen_before, STOCKFISH_DEPTH)) hits++;
      }
    }
    return positions ? hits / positions : 0;
  }

  function formatDuration(s) {
    if (!isFinite(s) || s <= 0) return "—";
    if (s < 60) return `${Math.round(s)}s`;
    const m = Math.floor(s / 60), sec = Math.round(s % 60);
    if (m < 60) return sec ? `${m}m ${sec}s` : `${m}m`;
    const h = Math.floor(m / 60), rm = m % 60;
    return rm ? `${h}h ${rm}m` : `${h}h`;
  }
  // Faixa de incerteza do Score conforme depth (alinhada com .claude/skills/_chess_shared/compute.py:score_uncertainty_band)
  function depthHintLabel(d) {
    if (!d || d < 1) return "";
    if (d < 12)  return `(d${d} ⚠ preview — só detecta erros grosseiros, Score com incerteza ±1.5)`;
    if (d < 15)  return `(d${d} — rápido, Score com incerteza ±1.0)`;
    if (d < 18)  return `(d${d} ✓ padrão recomendado, incerteza ±0.5)`;
    if (d < 20)  return `(d${d} ✓✓ análise séria, incerteza ±0.2)`;
    return `(d${d} — referência canônica, lento)`;
  }
  function updateDepthHint() {
    const d = parseInt(document.getElementById("input-depth").value, 10);
    const el = document.getElementById("depth-hint");
    if (el) el.textContent = depthHintLabel(d);
  }
  function updateEstimate() {
    const t = parseInt(document.getElementById("input-target").value, 10);
    const d = parseInt(document.getElementById("input-depth").value, 10);
    const eng = document.getElementById("input-engine").value;
    const el = document.getElementById("estimate");
    updateDepthHint();
    if (!t || !d || t < 1 || d < 1) { el.textContent = "⏱ tempo estimado: —"; return; }
    const positions = expectedTotalPositions();
    const hitRate = expectedCacheHitRate();
    const positionsToAnalyze = Math.round(positions * (1 - hitRate));
    const secPerPos = estimateSecondsPerPosition(d, eng);
    const sec = positionsToAnalyze * secPerPos;
    const lo = formatDuration(sec * 0.85), hi = formatDuration(sec * 1.5);
    const avgPlies = avgPliesFromGames();
    const engLabel = eng === "local" ? "Stockfish local" : "API remota";
    const cacheNote = hitRate > 0 ? ` · cache ~${Math.round(hitRate * 100)}%` : "";
    const expectedGames = QUOTA_MODE === "total" ? TARGET : TARGET * TIME_CLASSES.size;
    const basisFormula = QUOTA_MODE === "total"
      ? `${TARGET} total (recência) em ${TIME_CLASSES.size} formato${TIME_CLASSES.size > 1 ? "s" : ""}`
      : `${TARGET}/formato × ${TIME_CLASSES.size} = ~${expectedGames} partidas`;
    const basis = allGames.length
      ? `${allGames.length} partidas (${avgPlies} lances/partida em média, ${positions} posições${cacheNote})`
      : `${basisFormula}, ~${positions} posições`;
    el.textContent = `⏱ ${engLabel} d${d} (${basis}): ${lo} – ${hi}`;
  }
  function renderModeBadge() {
    const el = document.getElementById("mode-badge");
    if (!el) return;
    if (SERVER_MODE) {
      el.innerHTML = '<span style="color:#6fcf6f;background:#0a3a0a;padding:2px 8px;border-radius:3px;font-size:11px;letter-spacing:1px">SERVER MODE · history.db</span>';
    } else {
      el.innerHTML = '<span style="color:#e05555;background:#3a0a0a;padding:2px 8px;border-radius:3px;font-size:11px;letter-spacing:1px">⚠ SERVIDOR DESLIGADO — rode <code style="background:#1a0a0a;padding:1px 4px;border-radius:2px">scripts/start.sh</code> e abra http://127.0.0.1:8000/</span>';
    }
  }
  document.addEventListener("DOMContentLoaded", () => {
    renderModeBadge();
    ["input-target", "input-depth", "input-engine"].forEach(id =>
      document.getElementById(id).addEventListener("input", () => { try { readConfig(); } catch (_) {} updateEstimate(); }));
    document.getElementById("input-engine").addEventListener("change", () => { try { readConfig(); } catch (_) {} updateEstimate(); });
    document.querySelectorAll(".tf-cb").forEach(cb =>
      cb.addEventListener("change", () => { try { readConfig(); } catch (_) {} updateEstimate(); }));
    document.querySelectorAll('input[name="quota-mode"]').forEach(r =>
      r.addEventListener("change", () => { try { readConfig(); } catch (_) {} updateEstimate(); }));
    // Username/depth mudam → recalcula estado do DB.
    let dbStateDebounce;
    const triggerDbRefresh = () => { clearTimeout(dbStateDebounce); dbStateDebounce = setTimeout(refreshDbState, 350); };
    document.getElementById("input-username").addEventListener("input", triggerDbRefresh);
    document.getElementById("input-depth").addEventListener("input", triggerDbRefresh);
    updateEstimate();
    refreshDbState();
  });

  function log(msg, cls = "log-normal") {
    const div = document.getElementById("log");
    const cursor = div.querySelector(".cursor");
    if (cursor) cursor.remove();
    const span = document.createElement("div");
    span.className = cls;
    span.textContent = msg;
    div.appendChild(span);
    div.scrollTop = div.scrollHeight;
  }

  function showCursor() {
    const div = document.getElementById("log");
    const span = document.createElement("span");
    span.className = "cursor";
    span.textContent = "▌";
    div.appendChild(span);
    div.scrollTop = div.scrollHeight;
  }

  function removeCursor() {
    const c = document.querySelector(".cursor");
    if (c) c.remove();
  }

  function parseGames(games) {
    return games.map(g => {
      const isWhite = g.white?.username?.toLowerCase() === USERNAME.toLowerCase();
      const me = isWhite ? g.white : g.black;
      const opp = isWhite ? g.black : g.white;
      const result = me?.result === "win" ? "Win" : opp?.result === "win" ? "Loss" : "Draw";
      const termination = (me?.result === "win" ? opp?.result : me?.result) || "";
      const date = g.end_time ? new Date(g.end_time * 1000).toISOString().split("T")[0] : "";
      return {
        date,
        color: isWhite ? "White" : "Black",
        opponent: opp?.username || "",
        opponent_rating: opp?.rating || "",
        my_rating: me?.rating || "",
        result,
        termination,
        time_control: g.time_control || "",
        time_class: g.time_class || "",
        opening: g.opening || "",
        eco: "",
        eco_ply: "",
        eco_family: "",
        url: g.url || "",
        pgn: g.pgn || "",
      };
    });
  }

  function applyOpeningClassification(games) {
    let hits = 0;
    for (const g of games) {
      const cls = classifyOpening(g.pgn);
      if (!cls) continue;
      g.eco = cls.eco;
      g.opening = `${cls.eco} ${cls.name}`;
      g.eco_ply = cls.eco_ply;
      g.eco_family = cls.name.split(":")[0].trim();
      hits++;
    }
    return hits;
  }

  function resetSession() {
    document.getElementById("log").innerHTML = '<span class="log-idle">Aguardando início...</span>';
    document.getElementById("stats").style.display = "none";
    document.getElementById("preview").style.display = "none";
    allGames = [];
    allAnalysis = [];
    terminateStockfish();
    updateEstimate();
    refreshDbState();
  }

  async function fetchGames() {
    if (!SERVER_MODE) {
      alert("Servidor desligado. Abra um terminal e rode `bash scripts/start.sh` (ou `/app-start`), depois acesse http://127.0.0.1:8000/.");
      return;
    }
    const btn = document.getElementById("btn-fetch");
    try { readConfig(); } catch (e) { alert(e.message); return; }
    btn.disabled = true;
    btn.textContent = "Buscando...";
    document.getElementById("stats").style.display = "none";
    document.getElementById("preview").style.display = "none";
    allGames = [];
    log("─".repeat(40), "log-idle");
    const quotaLabel = QUOTA_MODE === "total" ? `${TARGET} total` : `${TARGET}/formato`;
    log(`▶ Nova busca: ${USERNAME} · ${quotaLabel} (${[...TIME_CLASSES].join("+")}) · depth ${STOCKFISH_DEPTH}`);

    try {
      log("Carregando base ECO (Lichess)...");
      await loadEcoIndex();
      log(`  ✓ ${Object.keys(ecoIndex).length} posições de abertura indexadas.`);

      log("Buscando arquivos de partidas...");
      showCursor();

      const archRes = await fetch(`https://api.chess.com/pub/player/${USERNAME}/games/archives`, {
        headers: { "User-Agent": "chess-export/1.0" }
      });
      if (!archRes.ok) throw new Error(`Erro ao buscar arquivos: ${archRes.status}`);
      const { archives } = await archRes.json();
      if (!archives?.length) throw new Error("Nenhum arquivo encontrado.");

      log(`${archives.length} meses encontrados. Coletando partidas...`);

      // Contadores: per-style = um por formato; total = um único global.
      const counters = {};
      TIME_CLASSES.forEach(tc => counters[tc] = 0);
      let totalCount = 0;
      const isQuotaMet = QUOTA_MODE === "total"
        ? () => totalCount >= TARGET
        : () => [...TIME_CLASSES].every(tc => counters[tc] >= TARGET);
      const fmtCounters = QUOTA_MODE === "total"
        ? () => `total:${totalCount}/${TARGET} (${[...TIME_CLASSES].map(tc => `${tc}:${counters[tc]}`).join(" ")})`
        : () => [...TIME_CLASSES].map(tc => `${tc}:${counters[tc]}/${TARGET}`).join(" ");

      const collected = [];
      for (let i = archives.length - 1; i >= 0; i--) {
        if (isQuotaMet()) break;
        const url = archives[i];
        const month = url.split("/").slice(-2).join("/");
        log(`Lendo ${month}... (${fmtCounters()})`);
        showCursor();

        const res = await fetch(url, {
          headers: { "User-Agent": "chess-export/1.0" }
        });
        if (!res.ok) { log(`  ⚠ Erro em ${month}, pulando.`, "log-warn"); continue; }
        const { games } = await res.json();
        if (!games?.length) continue;
        const parsed = parseGames(games);
        let added = 0, skippedTime = 0, skippedShort = 0, skippedFull = 0;
        // Itera newest→oldest dentro do mês (Chess.com retorna oldest-first)
        for (let j = parsed.length - 1; j >= 0; j--) {
          const g = parsed[j];
          const tc = g.time_class;
          if (!TIME_CLASSES.has(tc)) { skippedTime++; continue; }
          if (QUOTA_MODE === "total") {
            if (totalCount >= TARGET) { skippedFull++; continue; }
          } else {
            if (counters[tc] >= TARGET) { skippedFull++; continue; }
          }
          if (countPlies(g.pgn) < MIN_PLIES) { skippedShort++; continue; }
          collected.push(g);
          counters[tc]++;
          totalCount++;
          added++;
          if (QUOTA_MODE === "total" && totalCount >= TARGET) break;
        }
        const notes = [
          skippedTime ? `${skippedTime} ritmo` : "",
          skippedShort ? `${skippedShort} <${MIN_PLIES} lances` : "",
          skippedFull ? `${skippedFull} cota cheia` : "",
        ].filter(Boolean).join(", ");
        log(`  ✓ ${added} adicionadas${notes ? ` (descartadas: ${notes})` : ""} · ${fmtCounters()}`);
      }
      // Coletado newest-first; inverte para chronological (oldest-first)
      collected.reverse();
      allGames = collected;
      removeCursor();
      const ecoHits = applyOpeningClassification(allGames);
      const pct = allGames.length ? Math.round((ecoHits / allGames.length) * 100) : 0;
      log(`📚 Aberturas classificadas via ECO: ${ecoHits}/${allGames.length} (${pct}%).`);
      // Pré-carrega o cache para que a estimativa já reflita hit-rate
      await loadPositionCache();
      // Calibração observada para ajustar estimateSecondsPerPosition.
      await loadCalibration();
      // Server mode: persiste partidas no SQLite local. Idempotente — re-rodar
      // não duplica, só atualiza fetched_at + campos de eco (caso melhorem).
      if (SERVER_MODE) {
        try {
          const payload = allGames.map(g => ({
            game_id: g.url || `${USERNAME}_${g.date}_${g.opponent}`,
            username: USERNAME,
            date: g.date, color: g.color, opponent: g.opponent,
            opponent_rating: g.opponent_rating || null,
            my_rating: g.my_rating || null,
            result: g.result, termination: g.termination,
            time_control: g.time_control, time_class: g.time_class,
            opening: g.opening, eco: g.eco, eco_ply: g.eco_ply || null,
            eco_family: g.eco_family, url: g.url, pgn: g.pgn,
          }));
          const r = await api("/api/games", { games: payload });
          log(`💾 ${r.upserted} partidas persistidas em history.db.`, "log-ok");
        } catch (e) {
          log(`⚠ Falha ao persistir no servidor (${e.message}); continuando.`, "log-warn");
        }
      }
      log(`✅ Pronto! ${allGames.length} partidas coletadas.`, "log-ok");
      updateEstimate();
      renderPreview();
      refreshDbState();

    } catch (e) {
      removeCursor();
      log("❌ " + e.message, "log-err");
    }

    btn.disabled = false;
    btn.textContent = "Buscar Partidas";
  }

  function timestamp() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  }

  function normalizePGN(pgn) {
    if (!pgn) return "";
    let s = String(pgn).replace(/\r\n?/g, "\n");
    if (!s.includes("\n")) {
      s = s.replace(/\]\s*\[/g, "]\n[").replace(/\]\s*(?=1\.)/, "]\n\n");
    }
    return s;
  }

  const MIN_PLIES = 15;
  const ECO_MAX_PLIES = 25;
  const ECO_INDEX_URL = "data/openings/eco.json";
  const POSITION_CACHE_URL = "data/openings/position_cache.json";
  let ecoIndex = null;
  let positionCache = null;
  let cacheStats = { hits: 0, misses: 0 };

  async function loadPositionCache() {
    if (positionCache !== null) return positionCache;
    try {
      const res = await fetch(POSITION_CACHE_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      positionCache = await res.json();
      return positionCache;
    } catch (e) {
      log(`  ⚠ Cache de posições não disponível (${e.message}). Análise vai rodar tudo do zero.`, "log-warn");
      positionCache = {};
      return positionCache;
    }
  }

  function fenCacheKey(fen) {
    return (fen || "").split(" ").slice(0, 3).join(" ");
  }

  function getCachedAnalysis(fen, minDepth) {
    if (!positionCache) return null;
    const hit = positionCache[fenCacheKey(fen)];
    if (hit && hit.depth >= minDepth) return hit;
    return null;
  }

  async function loadEcoIndex() {
    if (ecoIndex) return ecoIndex;
    try {
      const res = await fetch(ECO_INDEX_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      ecoIndex = await res.json();
      return ecoIndex;
    } catch (e) {
      log(`  ⚠ Não foi possível carregar ${ECO_INDEX_URL} (${e.message}). Aberturas ficarão sem ECO.`, "log-warn");
      ecoIndex = {};
      return ecoIndex;
    }
  }

  function fenToEpd(fen) {
    return fen.split(" ").slice(0, 3).join(" ");
  }

  function classifyOpening(pgn) {
    if (!pgn || !ecoIndex) return null;
    const chess = new Chess();
    if (!chess.load_pgn(normalizePGN(pgn), { sloppy: true })) return null;
    const history = chess.history({ verbose: true });
    const replay = new Chess();
    let best = null;
    const limit = Math.min(history.length, ECO_MAX_PLIES);
    for (let i = 0; i < limit; i++) {
      replay.move(history[i]);
      const epd = fenToEpd(replay.fen());
      const hit = ecoIndex[epd];
      if (hit) best = { ...hit, eco_ply: i + 1 };
    }
    return best;
  }

  function countPlies(pgn) {
    if (!pgn) return 0;
    const chess = new Chess();
    if (!chess.load_pgn(normalizePGN(pgn), { sloppy: true })) return 0;
    return chess.history().length;
  }

  function extractMovesFromPGN(pgn) {
    const chess = new Chess();
    const normalized = normalizePGN(pgn);
    if (!chess.load_pgn(normalized, { sloppy: true })) return null;
    const history = chess.history({ verbose: true });
    const replay = new Chess();
    const positions = [{ ply: 0, fen_before: replay.fen(), move_san: "", move_uci: "", color: "" }];
    history.forEach((mv, i) => {
      const fenBefore = replay.fen();
      replay.move(mv);
      positions.push({
        ply: i + 1,
        fen_before: fenBefore,
        fen_after: replay.fen(),
        move_san: mv.san,
        move_uci: mv.from + mv.to + (mv.promotion || ""),
        color: mv.color === "w" ? "White" : "Black",
      });
    });
    return positions.slice(1);
  }

  let apiDiagnostics = null;
  function recordApiCall(record) {
    if (!apiDiagnostics) return;
    apiDiagnostics.calls.push(record);
    if (record.ok) apiDiagnostics.ok++;
    else {
      apiDiagnostics.failed++;
      const key = record.errorKind || "unknown";
      apiDiagnostics.byKind[key] = (apiDiagnostics.byKind[key] || 0) + 1;
    }
    if (record.latencyMs != null) apiDiagnostics.latencies.push(record.latencyMs);
  }
  function classifyError(msg) {
    if (!msg) return "unknown";
    if (/HTTP 429|rate/i.test(msg)) return "rate_limit_429";
    if (/HTTP 5\d\d/i.test(msg)) return "server_5xx";
    if (/HTTP 4\d\d/i.test(msg)) return "client_4xx";
    if (/Failed to fetch|NetworkError|network|TypeError/i.test(msg)) return "network";
    if (/timeout|aborted/i.test(msg)) return "timeout";
    if (/JSON|Unexpected token/i.test(msg)) return "bad_json";
    return msg.slice(0, 60);
  }

  function printApiDiagnostics() {
    if (!apiDiagnostics) return;
    const d = apiDiagnostics;
    const total = d.calls.length;
    if (!total) return;
    const lats = d.latencies.slice().sort((a, b) => a - b);
    const pct = p => lats.length ? Math.round(lats[Math.min(lats.length - 1, Math.floor(p * lats.length))]) : 0;
    log("─── 🔬 Diagnóstico API Stockfish ───", "log-normal");
    log(`  requisições: ${total} | ok: ${d.ok} | falhas: ${d.failed} (${(100 * d.failed / total).toFixed(1)}%)`);
    log(`  latência (ok): p50 ${pct(0.5)}ms · p90 ${pct(0.9)}ms · p99 ${pct(0.99)}ms · max ${pct(0.9999)}ms`);
    if (d.failed) {
      log("  falhas por tipo:");
      Object.entries(d.byKind).sort((a, b) => b[1] - a[1])
        .forEach(([k, v]) => log(`    · ${k}: ${v}`, "log-warn"));
      // Sample 3 failed calls for inspection
      const failed = d.calls.filter(c => !c.ok && c.final);
      const sample = failed.slice(0, 3);
      if (sample.length) {
        log("  exemplos de falhas (3 primeiras):");
        sample.forEach((c, i) => log(`    [${i + 1}] ${c.errorKind} · "${(c.errorMsg || '').slice(0, 80)}" · fen=${c.fen.slice(0, 40)}…`, "log-warn"));
      }
      // Detect bursts (consecutive failures within 2s)
      let bursts = 0, currentBurst = 0, maxBurst = 0;
      for (const c of d.calls) {
        if (!c.ok) { currentBurst++; if (currentBurst > maxBurst) maxBurst = currentBurst; }
        else { if (currentBurst >= 3) bursts++; currentBurst = 0; }
      }
      if (currentBurst >= 3) bursts++;
      log(`  rajadas de erro consecutivo (≥3): ${bursts} | maior rajada: ${maxBurst}`, bursts ? "log-warn" : "log-normal");
      log(`  💡 Use o botão "↓ Diagnóstico API" para baixar log JSON completo.`, "log-normal");
    }
    log("──────────────────────────────────", "log-normal");
  }

  function downloadDiagnostics() {
    if (!apiDiagnostics || !apiDiagnostics.calls.length) {
      alert("Nenhum diagnóstico disponível. Rode uma análise primeiro.");
      return;
    }
    const payload = {
      username: USERNAME,
      depth: STOCKFISH_DEPTH,
      stockfish_api: STOCKFISH_API,
      summary: {
        total: apiDiagnostics.calls.length,
        ok: apiDiagnostics.ok,
        failed: apiDiagnostics.failed,
        by_kind: apiDiagnostics.byKind,
        started_at: new Date(apiDiagnostics.startedAt).toISOString(),
      },
      calls: apiDiagnostics.calls,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${USERNAME}_${timestamp()}_apidiag_d${STOCKFISH_DEPTH}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const ANALYZE_TIMEOUT_MS = 15000;
  const ANALYZE_THROTTLE_MS = 50;
  const MAX_RETRIES_DEFAULT = 4;

  // ── Stockfish WASM local ──────────────────────────────────────────
  let SFWorker = null;
  let SFInitPromise = null;

  async function fetchStockfishScript() {
    const errors = [];
    for (const url of STOCKFISH_WASM_URLS) {
      try {
        log(`  ↻ baixando engine de ${url.split("/")[2]}...`);
        const res = await fetch(url, { cache: "force-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        if (!text.length) throw new Error("script vazio");
        log(`  ✓ baixado (${(text.length / 1024).toFixed(0)}KB) de ${url.split("/")[2]}`);
        return { text, baseUrl: url.replace(/[^/]+$/, "") };
      } catch (e) {
        errors.push(`${url.split("/")[2]}: ${e.message}`);
        log(`  ✗ ${url.split("/")[2]} falhou: ${e.message}`, "log-warn");
      }
    }
    throw new Error("Nenhum CDN de Stockfish acessível. " + errors.join(" | "));
  }

  function initStockfish() {
    if (SFInitPromise) return SFInitPromise;
    SFInitPromise = (async () => {
      const { text: scriptSrc, baseUrl } = await fetchStockfishScript();
      log("  ⚙ instanciando worker...");
      const prelude =
        `self.Module = self.Module || {};` +
        `self.Module.locateFile = function(name){ return ${JSON.stringify(baseUrl)} + name; };` +
        `self.Module.print = function(s){ self.postMessage(s); };` +
        `self.Module.printErr = function(s){ self.postMessage("ERR " + s); };` +
        `\n`;
      const blob = new Blob([prelude + scriptSrc], { type: "application/javascript" });
      SFWorker = new Worker(URL.createObjectURL(blob));

      return new Promise((resolve, reject) => {
        let stage = "waiting-uciok";
        let lastMsgAt = Date.now();
        const initTimeout = setTimeout(() => {
          SFWorker.removeEventListener("message", initHandler);
          const idle = ((Date.now() - lastMsgAt) / 1000).toFixed(1);
          reject(new Error(`engine não respondeu em 180s (estágio: ${stage}, último msg há ${idle}s)`));
        }, 180000);

        const initHandler = (e) => {
          const line = typeof e.data === "string" ? e.data : "";
          lastMsgAt = Date.now();
          console.log("[sf]", line);
          if (line.startsWith("ERR ")) {
            console.warn("[stockfish stderr]", line.slice(4));
          }
          if (line === "uciok") {
            stage = "waiting-readyok";
            // Tabela de transposição: default 16MB → 256MB. Acelera 10–20%
            // em sequências longas (finais técnicos com transposições).
            SFWorker.postMessage("setoption name Hash value 256");
            SFWorker.postMessage("isready");
          } else if (line === "readyok") {
            clearTimeout(initTimeout);
            SFWorker.removeEventListener("message", initHandler);
            resolve();
          }
        };
        SFWorker.addEventListener("message", initHandler);
        SFWorker.onerror = (err) => {
          clearTimeout(initTimeout);
          console.error("[sf onerror]", err);
          reject(new Error(err.message || `worker error (estágio: ${stage})`));
        };
        SFWorker.postMessage("uci");
      });
    })();
    SFInitPromise.catch(() => { SFInitPromise = null; });
    return SFInitPromise;
  }

  function terminateStockfish() {
    if (SFWorker) { try { SFWorker.terminate(); } catch (_) {} }
    SFWorker = null;
    SFInitPromise = null;
  }

  // Aguarda 'readyok' do engine — handshake UCI obrigatório entre comandos para
  // garantir que estado anterior foi totalmente limpo antes do novo position/go.
  function waitReadyOk(timeoutMs = 5000) {
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => {
        SFWorker.removeEventListener("message", handler);
        reject(new Error("isready timeout"));
      }, timeoutMs);
      const handler = (e) => {
        if (typeof e.data === "string" && e.data.trim() === "readyok") {
          clearTimeout(t);
          SFWorker.removeEventListener("message", handler);
          resolve();
        }
      };
      SFWorker.addEventListener("message", handler);
      SFWorker.postMessage("isready");
    });
  }

  function isLegalUci(fen, uci) {
    if (!uci || uci === "(none)" || uci.length < 4) return false;
    try {
      const c = new Chess(fen);
      const m = c.move({
        from: uci.slice(0, 2),
        to: uci.slice(2, 4),
        promotion: uci.length > 4 ? uci.slice(4) : undefined,
      });
      return !!m;
    } catch (_) {
      return false;
    }
  }

  async function analyzeFENLocal(fen, depth) {
    await initStockfish();
    // Sync handshake: stop qualquer busca pendente, reseta state, espera readyok
    SFWorker.postMessage("stop");
    SFWorker.postMessage("ucinewgame");
    await waitReadyOk();
    return new Promise((resolve, reject) => {
      const sideToMove = (fen.split(" ")[1] || "w").toLowerCase();
      let lastInfo = null;
      const timer = setTimeout(() => {
        SFWorker.removeEventListener("message", handler);
        reject(new Error("local engine timeout"));
      }, ANALYZE_TIMEOUT_MS);
      const handler = (e) => {
        const line = typeof e.data === "string" ? e.data : "";
        if (line.startsWith("info ") && /score (cp|mate)/.test(line)) {
          lastInfo = line;
        } else if (line.startsWith("bestmove")) {
          clearTimeout(timer);
          SFWorker.removeEventListener("message", handler);
          let evalPawns = "", mate = "", bestMove = "", continuation = "";
          const bm = line.match(/bestmove\s+(\S+)/);
          if (bm && bm[1] !== "(none)" && isLegalUci(fen, bm[1])) {
            bestMove = bm[1];
          }
          if (lastInfo) {
            const cpMatch = lastInfo.match(/score cp (-?\d+)/);
            const mateMatch = lastInfo.match(/score mate (-?\d+)/);
            if (mateMatch) {
              let m = parseInt(mateMatch[1], 10);
              if (sideToMove === "b") m = -m;
              mate = m;
            } else if (cpMatch) {
              let cp = parseInt(cpMatch[1], 10);
              if (sideToMove === "b") cp = -cp;
              evalPawns = (cp / 100).toFixed(2);
            }
            const pvMatch = lastInfo.match(/\spv\s+(.+)$/);
            if (pvMatch) continuation = pvMatch[1].trim();
          }
          resolve({ evaluation: evalPawns, mate, best_move: bestMove, continuation });
        }
      };
      SFWorker.addEventListener("message", handler);
      SFWorker.postMessage(`position fen ${fen}`);
      SFWorker.postMessage(`go depth ${depth}`);
    });
  }
  // ──────────────────────────────────────────────────────────────────

  async function analyzeFEN(fen, retries = MAX_RETRIES_DEFAULT) {
    // Cache hit: pula análise se já temos esta posição em depth suficiente
    const cached = getCachedAnalysis(fen, STOCKFISH_DEPTH);
    if (cached) {
      cacheStats.hits++;
      return {
        evaluation: cached.evaluation || "",
        mate: cached.mate || "",
        best_move: cached.best_move || "",
        continuation: "",
        cached: true,
      };
    }
    cacheStats.misses++;
    if (ENGINE === "local") {
      const t0 = performance.now();
      try {
        const r = await analyzeFENLocal(fen, STOCKFISH_DEPTH);
        recordApiCall({ ok: true, attempt: 0, latencyMs: performance.now() - t0, fen, ts: Date.now(), engine: "local" });
        return r;
      } catch (e) {
        recordApiCall({ ok: false, attempt: 0, latencyMs: performance.now() - t0, fen, ts: Date.now(), errorMsg: e.message, errorKind: "local_engine", final: true, engine: "local" });
        return { evaluation: "", mate: "", best_move: "", error: e.message, error_kind: "local_engine" };
      }
    }
    let lastErr = "";
    for (let attempt = 0; attempt <= retries; attempt++) {
      const t0 = performance.now();
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ANALYZE_TIMEOUT_MS);
      try {
        const url = `${STOCKFISH_API}?fen=${encodeURIComponent(fen)}&depth=${STOCKFISH_DEPTH}`;
        const res = await fetch(url, { signal: controller.signal, cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.data || "API error");
        let bestMove = "";
        if (data.bestmove) {
          const m = data.bestmove.match(/bestmove\s+(\S+)/);
          const candidate = m ? m[1] : data.bestmove;
          if (isLegalUci(fen, candidate)) bestMove = candidate;
        }
        recordApiCall({ ok: true, attempt, latencyMs: performance.now() - t0, fen, ts: Date.now() });
        return {
          evaluation: data.evaluation ?? "",
          mate: data.mate ?? "",
          best_move: bestMove,
          continuation: data.continuation || "",
        };
      } catch (e) {
        const msg = e.name === "AbortError" ? "timeout (15s)" : e.message;
        lastErr = msg;
        const kind = classifyError(msg);
        recordApiCall({ ok: false, attempt, latencyMs: performance.now() - t0, fen, ts: Date.now(), errorMsg: msg, errorKind: kind, final: attempt === retries });
        if (attempt === retries) return { evaluation: "", mate: "", best_move: "", error: msg, error_kind: kind };
        // backoff exponencial: 1s, 2s, 4s, 8s — mais agressivo em network/timeout, padrão p/ resto
        const base = (kind === "network" || kind === "timeout" || kind === "rate_limit_429") ? 1000 : 500;
        await new Promise(r => setTimeout(r, base * Math.pow(2, attempt)));
      } finally {
        clearTimeout(timer);
      }
    }
  }

  async function analyzeGames() {
    if (!SERVER_MODE) {
      alert("Servidor desligado. Abra um terminal e rode `bash scripts/start.sh` (ou `/app-start`).");
      return;
    }
    if (typeof Chess === "undefined") { log("❌ chess.js não carregou.", "log-err"); return; }
    if (!allGames.length) { log("⚠ Nenhuma partida para analisar.", "log-warn"); return; }
    try { readConfig(); } catch (e) { alert(e.message); return; }

    // Warning quando estimativa > 30 min — evita "rodei 5h sem perceber".
    // Usa o estimador já existente (estimateSecondsPerPosition + cache hit).
    const totalPos = expectedTotalPositions();
    const hitRate = expectedCacheHitRate();
    const estSec = totalPos * (1 - hitRate) * estimateSecondsPerPosition(STOCKFISH_DEPTH, ENGINE);
    if (estSec > 1800) {
      const minStr = Math.round(estSec / 60);
      const ok = confirm(`⏱ Estimativa: ~${minStr} min (${allGames.length} partidas, depth ${STOCKFISH_DEPTH}). Continuar?`);
      if (!ok) { log("⚠ Análise cancelada pelo usuário.", "log-warn"); return; }
    }

    const btn = document.getElementById("btn-analyze");
    const fetchBtn = document.getElementById("btn-fetch");
    btn.disabled = true; fetchBtn.disabled = true;
    btn.textContent = "Analisando...";
    allAnalysis = [];

    let analyzedPositions = 0;
    let apiErrors = 0;
    let dbHits = 0;
    apiDiagnostics = { calls: [], ok: 0, failed: 0, byKind: {}, latencies: [], startedAt: Date.now() };

    // Telemetria de execução: registra início no DB para recalibrar o estimador.
    let execLogId = null;
    const execStartedAt = Date.now();
    if (SERVER_MODE) {
      try {
        const r = await api("/api/execution-logs/start", {
          username: USERNAME, depth: STOCKFISH_DEPTH, engine: ENGINE,
          n_games: allGames.length,
          n_positions_total: totalPos,
          expected_seconds_at_start: estSec,
        });
        execLogId = r && r.id;
      } catch (_) { /* telemetria não bloqueia análise */ }
    }

    try {
      log(`▶ Iniciando análise Stockfish [${ENGINE === "local" ? "local WASM" : "API remota"}, depth=${STOCKFISH_DEPTH}] em ${allGames.length} partidas...`, "log-normal");
      cacheStats = { hits: 0, misses: 0 };
      log("Carregando cache de posições...");
      await loadPositionCache();
      log(`  ✓ ${Object.keys(positionCache).length} posições no cache local.`);
      log("Carregando índice de temas táticos...");
      const tacticalIdx = await TacticalThemes.loadTacticalIndex();
      const nB = Object.keys(tacticalIdx.B || {}).length;
      const nC = Object.keys(tacticalIdx.C || {}).length;
      if (nB || nC) log(`  ✓ ${nB} padrões posicionais + ${nC} padrões de erro indexados.`);
      if (ENGINE === "local") {
        log("  ⏳ carregando engine WASM (primeira vez baixa ~600KB)...");
        await initStockfish();
        log("  ✅ engine pronto.", "log-ok");
      }

      let totalPositions = 0;
      const gamesWithMoves = allGames.map((g, idx) => {
        const moves = extractMovesFromPGN(g.pgn);
        if (moves) totalPositions += moves.length;
        return { game: g, gameIndex: idx, moves };
      });

      log(`Total de posições a analisar: ${totalPositions}`);
      if (totalPositions === 0) {
        log("❌ Nenhuma posição extraível dos PGNs. Abortando.", "log-err");
        return;
      }

      // Server mode: pré-carrega análises das partidas da SESSÃO ATUAL via
      // filter ?game_ids=... — payload proporcional ao subset analisado, não
      // ao DB inteiro do user. Em sessão típica (50 jogos novos pra user com
      // 200 no DB) cai em ~75%.
      const existingByGame = {};   // {game_id: {ply: rowComplete}}
      // dbHits é hoisted (declarado fora do try) para entrar na telemetria.
      let pendingPostBuffer = [];
      // Flush canônico = ao terminar cada partida (alinha unidade de persistência
      // com unidade lógica). SAFETY_NET força flush em partidas anormalmente longas
      // (>200 plies) pra limitar janela de perda em caso de crash.
      const POST_SAFETY_NET = 200;
      if (SERVER_MODE) {
        try {
          const sessionGameIds = allGames
            .map(g => g.url || `${USERNAME}_${g.date}_${g.opponent}`)
            .filter(Boolean);
          const idsParam = sessionGameIds.length
            ? `&game_ids=${encodeURIComponent(sessionGameIds.join(","))}`
            : "";
          const rows = await api(`/api/analyses?username=${encodeURIComponent(USERNAME)}&min_depth=0${idsParam}`);
          for (const r of rows) {
            if (!existingByGame[r.game_id]) existingByGame[r.game_id] = {};
            existingByGame[r.game_id][r.ply] = r;
          }
          const reused = rows.filter(r => r.depth >= STOCKFISH_DEPTH).length;
          log(`  ✓ ${rows.length} lances já analisados em history.db nas ${sessionGameIds.length} partidas da sessão; ${reused} reutilizáveis (depth ≥ ${STOCKFISH_DEPTH}).`);
        } catch (e) {
          log(`  ⚠ Não foi possível ler análises pré-existentes (${e.message}).`, "log-warn");
        }
      }
      showCursor();

      for (const { game, gameIndex, moves } of gamesWithMoves) {
        if (!moves) {
          removeCursor();
          log(`  ⚠ Partida ${gameIndex + 1}: PGN inválido, pulando.`, "log-warn");
          showCursor();
          continue;
        }
        removeCursor();
        log(`Partida ${gameIndex + 1}/${allGames.length} — ${game.opponent} (${moves.length} lances)`);
        showCursor();

        const gameId = game.url || `${USERNAME}_${game.date}_${game.opponent}`;
        const cachedForGame = existingByGame[gameId] || {};

        for (const mv of moves) {
          // Dedup em SQLite: se já analisado em depth >= alvo, reutiliza.
          const cachedRow = cachedForGame[mv.ply];
          let analysis;
          let cameFromDb = false;
          if (cachedRow && cachedRow.depth >= STOCKFISH_DEPTH) {
            analysis = {
              evaluation: cachedRow.evaluation || "",
              mate: cachedRow.mate || "",
              best_move: cachedRow.best_move || "",
              continuation: cachedRow.continuation || "",
            };
            cameFromDb = true;
            dbHits++;
          } else {
            analysis = await analyzeFEN(mv.fen_before);
            if (analysis.error) apiErrors++;
            if (ENGINE === "api" && ANALYZE_THROTTLE_MS) await new Promise(r => setTimeout(r, ANALYZE_THROTTLE_MS));
          }
          analyzedPositions++;
          // Classificação de tema tático: usa best_move (Stockfish) sobre a posição
          // antes do lance. Trade-off: rodar mesmo em posições de baixo loss_cp
          // simplifica o pipeline; o relatório filtra por loss_cp depois.
          let tactical = null;
          if (analysis.best_move) {
            try { tactical = TacticalThemes.classifyPosition(mv.fen_before, analysis.best_move, mv.move_uci); }
            catch (_) { /* não bloquear análise se classificação falhar */ }
          }
          const record = {
            game_index: gameIndex + 1,
            game_url: game.url,
            date: game.date,
            color: game.color,
            opponent: game.opponent,
            ply: mv.ply,
            move_number: Math.ceil(mv.ply / 2),
            side_to_move: mv.color,
            move_san: mv.move_san,
            move_uci: mv.move_uci,
            fen_before: mv.fen_before,
            depth: cameFromDb ? cachedRow.depth : STOCKFISH_DEPTH,
            evaluation: analysis.evaluation,
            mate: analysis.mate,
            best_move: analysis.best_move,
            continuation: analysis.continuation || "",
            tactical_theme: tactical ? tactical.theme : "",
            tactical_confidence: tactical ? tactical.confidence : "",
            tactical_source: tactical ? tactical.source : "",
          };
          allAnalysis.push(record);

          // Server mode: enfileira pra POST. Só envia se foi análise nova
          // (evita re-postar o que já veio do DB).
          if (SERVER_MODE && !cameFromDb && analysis.best_move) {
            pendingPostBuffer.push({
              game_id: gameId,
              ply: mv.ply,
              side_to_move: mv.color,
              move_san: mv.move_san,
              move_uci: mv.move_uci,
              fen_before: mv.fen_before,
              depth: STOCKFISH_DEPTH,
              evaluation: analysis.evaluation || null,
              mate: analysis.mate ? String(analysis.mate) : null,
              best_move: analysis.best_move || null,
              continuation: analysis.continuation || null,
              tactical_theme: tactical ? tactical.theme : null,
              tactical_confidence: tactical ? tactical.confidence : null,
              tactical_source: tactical ? tactical.source : null,
            });
            // Safety net: só dispara em partidas anormalmente longas
            if (pendingPostBuffer.length >= POST_SAFETY_NET) {
              try { await api("/api/analyses", { rows: pendingPostBuffer }); } catch (_) {}
              pendingPostBuffer = [];
            }
          }

          if (analyzedPositions % 10 === 0) {
            removeCursor();
            log(`  … ${analyzedPositions}/${totalPositions} posições analisadas${apiErrors ? ` (${apiErrors} falhas API)` : ""}`);
            showCursor();
          }
        }
        // Flush por partida: alinha unidade de persistência com unidade lógica.
        // Reduz commits desnecessários e elimina batch que cruza partidas.
        if (SERVER_MODE && pendingPostBuffer.length) {
          try { await api("/api/analyses", { rows: pendingPostBuffer }); } catch (_) {}
          pendingPostBuffer = [];
        }
      }

      removeCursor();
      // Flush final do buffer pendente
      if (SERVER_MODE && pendingPostBuffer.length) {
        try {
          const r = await api("/api/analyses", { rows: pendingPostBuffer });
          log(`💾 ${r.saved} lances persistidos no servidor (último batch).`, "log-ok");
        } catch (e) {
          log(`⚠ Falha no flush final (${e.message}); ${pendingPostBuffer.length} lances ficaram em memória.`, "log-warn");
        }
        pendingPostBuffer = [];
      }
      const totalForRate = cacheStats.hits + cacheStats.misses;
      const hitRate = totalForRate ? Math.round(100 * cacheStats.hits / totalForRate) : 0;
      log(`✅ Análise concluída: ${analyzedPositions} posições${apiErrors ? ` (${apiErrors} com falha API)` : ""}.`, "log-ok");
      if (SERVER_MODE && dbHits) {
        log(`🗄  Reuso de history.db: ${dbHits} lances (${Math.round(100*dbHits/analyzedPositions)}%) puxados sem rodar Stockfish.`, "log-ok");
      }
      log(`📦 Cache de posições (JSON): ${cacheStats.hits} hits / ${cacheStats.misses} misses (${hitRate}% reaproveitado).`, "log-ok");
      printApiDiagnostics();
    } catch (e) {
      removeCursor();
      console.error(e);
      log(`❌ Erro na análise: ${e.message}`, "log-err");
    } finally {
      btn.disabled = false; fetchBtn.disabled = false;
      btn.textContent = "⚙ Analisar Stockfish";
      // Telemetria: encerra registro de execução com métricas finais.
      if (SERVER_MODE && execLogId) {
        const status = (typeof allAnalysis !== "undefined" && allAnalysis.length) ? "completed" : "errored";
        // posições efetivamente rodadas no engine (descontando reuso do DB)
        const enginePositions = Math.max(0, analyzedPositions - dbHits);
        try {
          await api("/api/execution-logs/end", {
            id: execLogId,
            duration_seconds: (Date.now() - execStartedAt) / 1000,
            n_positions_analyzed: enginePositions,
            n_db_hits: dbHits,
            n_cache_hits: cacheStats.hits,
            n_cache_misses: cacheStats.misses,
            n_failures: apiErrors,
            status,
          });
        } catch (_) { /* não bloquear UI */ }
      }
      if (allAnalysis.length) {
        log(`💾 ${allAnalysis.length} lances persistidos em history.db. Rode /report-myself ou /report-enemy ${USERNAME} para gerar PDF.`, "log-ok");
      } else {
        log("⚠ Nenhuma análise produzida.", "log-warn");
      }
      // Atualiza o painel "X partidas / Y pendentes" para refletir o novo estado.
      refreshDbState();
    }
  }
